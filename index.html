<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniStyle Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .tier-gold { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); }
        .tier-silver { background: linear-gradient(135deg, #94a3b8 0%, #475569 100%); }
        @keyframes slide { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .animate-slide { animation: slide 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-[#F8FAFC] min-h-screen">

    <div id="notif-box" class="fixed top-6 right-6 z-[100] flex flex-col gap-3 w-80"></div>

    <div id="landing" class="max-w-4xl mx-auto pt-32 px-6">
        <h1 class="text-5xl font-extrabold text-indigo-600 mb-12 text-center italic">OmniStyle</h1>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <button onclick="nav('user')" class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200 hover:border-indigo-500 transition-all text-left">
                <span class="text-xs font-bold text-indigo-500 uppercase">Customer</span>
                <span class="block text-2xl font-bold mt-1">My Rewards</span>
            </button>
            <button onclick="nav('staff')" class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200 hover:border-orange-500 transition-all text-left">
                <span class="text-xs font-bold text-orange-500 uppercase">Staff</span>
                <span class="block text-2xl font-bold mt-1">Service Desk</span>
            </button>
            <button onclick="loadAdmin()" class="bg-slate-900 p-8 rounded-[2rem] text-white shadow-xl hover:bg-black transition-all text-left">
                <span class="text-xs font-bold text-slate-400 uppercase">Manager</span>
                <span class="block text-2xl font-bold mt-1">Analytics</span>
            </button>
        </div>
    </div>

    <div id="user-sec" class="hidden max-w-lg mx-auto p-6">
        <div id="u-auth" class="bg-white p-10 rounded-[2.5rem] shadow-xl mt-10">
            <h2 class="text-3xl font-bold mb-8">Sign In</h2>
            <div id="u-signup" class="hidden mb-4"><input id="u-name" placeholder="Full Name" class="w-full bg-slate-50 p-4 rounded-2xl"></div>
            <input id="u-phone" placeholder="Phone Number" class="w-full bg-slate-50 p-4 rounded-2xl mb-6">
            <button onclick="authU()" id="ubtn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg">Login</button>
            <p onclick="toggleU()" class="text-center mt-6 text-sm text-slate-400 cursor-pointer">Switch Login/Signup</p>
        </div>
        <div id="u-dash" class="hidden space-y-6 mt-4">
            <div id="tcard" class="tier-silver p-8 rounded-[2.5rem] text-white shadow-2xl relative overflow-hidden">
                <p id="dtier" class="text-[10px] font-black uppercase tracking-widest opacity-80 mb-1">Silver Member</p>
                <h2 id="dname" class="text-2xl font-bold mb-10">Name</h2>
                <p class="text-sm opacity-70">Balance</p>
                <div class="flex items-baseline gap-2"><span id="dpts" class="text-5xl font-black">0</span><span class="font-bold">pts</span></div>
            </div>
            <div class="bg-white p-8 rounded-[2.5rem] flex justify-center shadow-sm border border-slate-100"><div id="qrcode"></div></div>
            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
                <h3 class="font-bold mb-4">Activity</h3>
                <div id="uhist" class="space-y-3"></div>
            </div>
            <button onclick="location.reload()" class="w-full py-4 text-slate-300 font-bold">Logout</button>
        </div>
    </div>

    <div id="staff-sec" class="hidden max-w-md mx-auto p-6">
        <div id="s-auth" class="bg-white p-10 rounded-[2.5rem] shadow-xl mt-10 border-t-8 border-orange-500">
            <h2 class="text-3xl font-bold mb-8">Staff Desk</h2>
            <div id="s-signup" class="hidden mb-4"><input id="s-name" placeholder="Name" class="w-full bg-slate-50 p-4 rounded-2xl"></div>
            <input id="s-id" placeholder="Staff ID" class="w-full bg-slate-50 p-4 rounded-2xl mb-3">
            <input id="s-pass" type="password" placeholder="Password" class="w-full bg-slate-50 p-4 rounded-2xl mb-6">
            <button onclick="authS()" id="sbtn" class="w-full bg-orange-500 text-white py-4 rounded-2xl font-bold shadow-lg">Login</button>
            <p onclick="toggleS()" class="text-center mt-6 text-sm text-slate-400 cursor-pointer">Register Staff</p>
        </div>
        <div id="s-dash" class="hidden mt-10 bg-white p-8 rounded-[2.5rem] shadow-lg space-y-4">
            <h2 class="font-bold text-xl mb-4 text-slate-800">Transaction</h2>
            <input id="t-phone" placeholder="Customer Phone" class="w-full bg-slate-50 p-4 rounded-2xl mb-2">
            <input id="t-amt" type="number" placeholder="Bill Amount (₹)" class="w-full bg-slate-50 p-4 rounded-2xl mb-4">
            <button onclick="addPts()" class="w-full bg-orange-500 text-white py-4 rounded-2xl font-bold shadow-lg">Add Points</button>
            <button onclick="redeem()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold">Redeem Reward</button>
            <button onclick="location.reload()" class="w-full py-4 text-slate-300 font-bold italic">Sign Out</button>
        </div>
    </div>

    <div id="manager-sec" class="hidden max-w-5xl mx-auto p-6 mt-10">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-3xl font-bold text-slate-800">Enterprise Analytics</h2>
            <button onclick="location.reload()" class="text-slate-400 font-bold">✕ Close</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100"><p class="text-xs font-bold text-slate-400 uppercase mb-2">Users</p><h3 id="m-users" class="text-3xl font-black text-indigo-600">0</h3></div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100"><p class="text-xs font-bold text-slate-400 uppercase mb-2">Revenue</p><h3 id="m-rev" class="text-3xl font-black text-green-600">₹0</h3></div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100"><p class="text-xs font-bold text-slate-400 uppercase mb-2">Gold Tier</p><h3 id="m-gold" class="text-3
