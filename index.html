<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OmniStyle Loyalty</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <div id="auth-screen" class="max-w-md mx-auto mt-20 p-6 bg-white rounded-xl shadow-lg">
        <h1 class="text-3xl font-bold text-center text-indigo-600 mb-6">OmniStyle</h1>
        
        <div class="flex mb-6 bg-gray-100 rounded-lg p-1">
            <button onclick="toggleAuth('login')" id="tab-login" class="flex-1 py-2 rounded-md bg-white shadow-sm font-bold">Login</button>
            <button onclick="toggleAuth('signup')" id="tab-signup" class="flex-1 py-2 rounded-md font-bold text-gray-500">Sign Up</button>
        </div>

        <div id="signup-fields" class="hidden">
            <input id="reg-name" placeholder="Full Name" class="w-full border p-3 rounded-lg mb-3">
        </div>
        <input id="reg-phone" placeholder="Phone Number" class="w-full border p-3 rounded-lg mb-4">
        
        <button onclick="handleAuth()" id="auth-btn" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold">Login to Account</button>
        <p class="text-center mt-4 text-sm text-blue-500 cursor-pointer" onclick="switchView('staff')">Switch to Staff Portal</p>
    </div>

    <div id="user-dash" class="hidden max-w-4xl mx-auto p-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-1 bg-white p-6 rounded-xl shadow-md text-center">
                <div id="qrcode" class="flex justify-center mb-4"></div>
                <h2 id="u-name" class="text-xl font-bold"></h2>
                <p id="u-tier" class="text-indigo-600 font-black tracking-widest uppercase"></p>
                <div class="mt-4 p-3 bg-gray-50 rounded-lg">
                    <p class="text-sm text-gray-500">Total Points</p>
                    <p id="u-points" class="text-3xl font-bold"></p>
                </div>
            </div>
            <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-md">
                <h3 class="font-bold border-b pb-2 mb-4">Recent Transactions</h3>
                <div id="u-history" class="space-y-3 overflow-y-auto max-h-60"></div>
            </div>
        </div>
        <button onclick="location.reload()" class="mt-6 text-gray-500 underline">Logout</button>
    </div>

    <div id="staff-dash" class="hidden max-w-md mx-auto mt-10 p-6 bg-white rounded-xl shadow-lg border-t-4 border-orange-500">
        <h2 class="text-2xl font-bold mb-4">Staff Transaction Desk</h2>
        <input id="s-phone" placeholder="Customer Phone" class="w-full border p-3 rounded-lg mb-3">
        <input id="s-amt" type="number" placeholder="Bill Amount (INR)" class="w-full border p-3 rounded-lg mb-4">
        <button onclick="processTransaction()" class="w-full bg-orange-500 text-white py-3 rounded-lg font-bold">Add Points</button>
        <p class="text-center mt-4 text-sm text-blue-500 cursor-pointer" onclick="location.reload()">Back to Customer Login</p>
    </div>

    <script>
        const API = ""; // Keep empty for same-domain Vercel deployment
        let currentMode = 'login';

        function toggleAuth(mode) {
            currentMode = mode;
            document.getElementById('signup-fields').classList.toggle('hidden', mode === 'login');
            document.getElementById('auth-btn').innerText = mode === 'login' ? 'Login to Account' : 'Create Account';
            document.getElementById('tab-login').className = mode === 'login' ? 'flex-1 py-2 rounded-md bg-white shadow-sm font-bold' : 'flex-1 py-2 rounded-md font-bold text-gray-500';
            document.getElementById('tab-signup').className = mode === 'signup' ? 'flex-1 py-2 rounded-md bg-white shadow-sm font-bold' : 'flex-1 py-2 rounded-md font-bold text-gray-500';
        }

        function switchView(view) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('staff-dash').classList.remove('hidden');
        }

        async function handleAuth() {
            const phone = document.getElementById('reg-phone').value;
            const name = document.getElementById('reg-name').value;
            const endpoint = currentMode === 'login' ? '/api/login' : '/api/signup';
            
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone, name })
            });

            if(res.ok) {
                const user = await res.json();
                renderUserDashboard(user);
            } else { alert("Error: Account not found or already exists."); }
        }

        function renderUserDashboard(user) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('user-dash').classList.remove('hidden');
            document.getElementById('u-name').innerText = user.name;
            document.getElementById('u-tier').innerText = user.membershipTier;
            document.getElementById('u-points').innerText = user.totalPoints;
            
            // QR Code
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: user.phone, width: 150, height: 150 });

            // History
            const history = document.getElementById('u-history');
            history.innerHTML = user.transactions.map(t => `
                <div class="flex justify-between p-3 bg-gray-50 rounded-lg">
                    <span>₹${t.amount} purchase</span>
                    <span class="text-green-600 font-bold">+${t.pointsEarned} pts</span>
                </div>
            `).join('') || '<p class="text-gray-400">No transactions yet.</p>';
        }

        async function processTransaction() {
            const phone = document.getElementById('s-phone').value;
            const amount = document.getElementById('s-amt').value;
            const res = await fetch('/api/add-transaction', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone, amount })
            });
            if(res.ok) {
                alert("Transaction Successful! Points updated.");
                document.getElementById('s-amt').value = '';
            } else { alert("Customer not found."); }
        }
    </script>
</body>
</html>
